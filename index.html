<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Courant : l'électricité française en direct, expliquée simplement. Consommation, production, échanges, Ecowatt, Tempo et ce que votre consommation coûterait, à partir des données publiques RTE."
    />
    <meta name="theme-color" content="#f4f6fa" />
    <script>
      // thème avant le premier rendu : aucun flash. Choix mémorisé, sinon préférence système.
      try {
        var stored = localStorage.getItem('courant-theme')
        var theme =
          stored === 'dark' || stored === 'light'
            ? stored
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch (e) {}
    </script>
    <title>Courant · L'électricité française en direct</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
