name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint strict type-checked)
        run: pnpm lint

      - name: Typecheck (TypeScript strict)
        run: pnpm typecheck

      - name: Typographie (aucun tiret long)
        run: pnpm check:typo

      - name: Format (Prettier)
        run: pnpm format:check

      - name: Tests unitaires et integration (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Installer Chromium pour Playwright
        run: pnpm exec playwright install chromium --with-deps

      - name: Tests E2E (Playwright)
        run: pnpm test:e2e
        env:
          CI: 'true'

      - name: Rapport Playwright en cas d'echec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
